# Configuration for the lychee link checker (see .github/workflows/link-check.yml)

# Treat these status codes as acceptable, not broken.
# 403/429 are common from sites with bot/anti-scraping protection (e.g. X/Twitter,
# rate-limited APIs) that work fine for real visitors but block CI runners.
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 403, 429]

# Retry flaky requests before reporting a failure.
max_retries = 3
retry_wait_time = 5

# Give slow sites a fair chance before marking them broken.
timeout = 20

# Skip mailto: links.
exclude_mail = true

# Known bot-hostile hosts that reliably block automated checkers even though
# the pages work fine for humans — excluded to avoid constant false-positive noise.
exclude = [
  "^https://(www\\.)?(twitter|x)\\.com",
  "^https://(www\\.)?discord\\.com/invite",
]
