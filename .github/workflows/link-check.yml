name: Link Checker

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Pinned: check_redirects.py parses this version's markdown report.
          lycheeVersion: v0.24.2
          args: >-
            --config .lychee.toml
            --no-progress
            --verbose
            './**/*.md'
          fail: true

      - name: Flag cross-domain redirects
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_redirects.py lychee/out.md

      - name: Find open link-check issue
        id: existing
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=broken-links&state=open&per_page=1" \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Updates the open issue if there is one (empty issue-number means create), so a
      # link that stays broken for weeks doesn't open a new issue every Monday.
      - name: Create or update issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly link check found broken or redirected links"
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: |
            broken-links
            automated
